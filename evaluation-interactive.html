<!doctype html>
<html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Évaluation interactive</title><style>body{font-family:system-ui;background:#edf5fb;color:#123251;margin:0;padding:24px}main{max-width:650px;background:white;padding:28px;border-radius:20px;margin:auto}label{display:block;padding:12px;border:1px solid #dce7ef;margin:8px 0;border-radius:10px}button{background:#145da0;color:white;border:0;padding:12px 20px;border-radius:10px;cursor:pointer}</style><main><h1>Évaluation du module</h1><form id="quiz"><p>1. Quelle action protège votre compte ?</p><label><input type="radio" name="q1" value="1" required> Activer la double authentification</label><label><input type="radio" name="q1" value="0"> Partager son mot de passe</label><p>2. Faut-il vérifier la source d’une information ?</p><label><input type="radio" name="q2" value="1" required> Oui</label><label><input type="radio" name="q2" value="0"> Non</label><button>Valider mes réponses</button></form><p id="resultat" role="status"></p></main><script>document.getElementById('quiz').addEventListener('submit',function(event){event.preventDefault();const data=new FormData(event.target);const score=Number(data.get('q1'))+Number(data.get('q2'));document.getElementById('resultat').textContent='Résultat : '+score+'/2';if(window.OASIS)OASIS.submit(score,2);});</script></html>
